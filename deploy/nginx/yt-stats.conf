# Panel statystyk YarnPower pod /yt/. Instalowany jako
# /etc/nginx/snippets/yt-stats.conf i dołączany w bloku server { } dla
# maciejgad.pl jedną linią:  include /etc/nginx/snippets/yt-stats.conf;
# Miejsce w bloku nie ma znaczenia: = i ^~ wygrywają z lokalizacjami
# z wyrażeniami regularnymi niezależnie od kolejności.
#
# Ruch: przeglądarka → Cloudflare (HTTPS) → Nginx → 127.0.0.1:8091.
# Prawdziwy adres klienta ustawia cloudflare-real-ip.conf (include niżej),
# więc $remote_addr to adres użytkownika, a nie serwera Cloudflare.

include /etc/nginx/snippets/cloudflare-real-ip.conf;

# /yt bez ukośnika → /yt/ (pełny adres https://, bo Nginx za Cloudflare
# widzi połączenie po HTTP i względny adres dałby skok przez http://)
location = /yt {
    return 301 https://$host/yt/;
}

# ^~ ma pierwszeństwo przed lokalizacjami z wyrażeniami regularnymi
# (np. ~ \.php$), więc dawne pliki PHP, CSV i JSON z katalogu /yt/
# nie są już serwowane ani wykonywane.
location ^~ /yt/ {
    # Bez ścieżki po adresie: prefiks /yt/ trafia do aplikacji bez zmian.
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Nadpisane (nie dopisane), żeby klient nie mógł podać własnego adresu.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 45s;      # pobranie statystyk trwa do 30 s
    client_max_body_size 16k;    # formularze mają do 4 KiB

    add_header Strict-Transport-Security "max-age=31536000" always;
}
