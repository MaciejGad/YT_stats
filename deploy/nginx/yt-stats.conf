# YarnPower statistics panel under /yt/. Installed as
# /etc/nginx/snippets/yt-stats.conf and included in the server { } block for
# maciejgad.pl with one line:  include /etc/nginx/snippets/yt-stats.conf;
# Its position in the block does not matter: = and ^~ win over regex
# locations regardless of order.
#
# Traffic: browser → Cloudflare (HTTPS) → Nginx → 127.0.0.1:8091.
# The real client address is set by cloudflare-real-ip.conf (include below),
# so $remote_addr is the user's address, not a Cloudflare server's.

include /etc/nginx/snippets/cloudflare-real-ip.conf;

# /yt without a slash → /yt/ (a full https:// URL, because Nginx behind Cloudflare
# sees an HTTP connection and a relative URL would bounce through http://)
location = /yt {
    return 301 https://$host/yt/;
}

# ^~ takes precedence over regex locations
# (e.g. ~ \.php$), so the old PHP, CSV and JSON files in the /yt/ directory
# are no longer served or executed.
location ^~ /yt/ {
    # No path after the address: the /yt/ prefix reaches the application unchanged.
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwritten (not appended), so the client cannot supply its own address.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 45s;      # fetching statistics takes up to 30 s
    client_max_body_size 16k;    # forms are up to 4 KiB

    add_header Strict-Transport-Security "max-age=31536000" always;
}
