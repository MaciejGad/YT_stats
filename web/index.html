<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YarnPower — statystyki</title>
<link rel="icon" href="/yt/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/yt/style.css">
</head>
<body>
<!-- Tymczasowy szablon; właściwy panel powstaje w kroku 4 planu. -->
<main>
  <h1>YarnPower</h1>
  {{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
  <p>Jesteś zalogowany. Statystyki pojawią się w kroku 4.</p>
  <form method="post" action="/yt/logout">
    <input type="hidden" name="csrf" value="{{.LogoutCSRF}}">
    <button type="submit">Wyloguj</button>
  </form>
</main>
<script src="/yt/script.js" defer></script>
</body>
</html>
