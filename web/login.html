<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Logowanie — {{.Channel.Title}}</title>
<link rel="icon" href="{{with .Channel.LogoURL}}{{.}}{{else}}{{asset "favicon.png"}}{{end}}">
<link rel="apple-touch-icon" href="{{with .Channel.LogoURL}}{{.}}{{else}}{{asset "logo.png"}}{{end}}">
<link rel="stylesheet" href="{{asset "style.css"}}">
</head>
<body class="login-body">
<main class="login">
  <div class="login-card">
    <div class="login-head">
      <img class="login-logo{{if .Channel.LogoURL}} is-avatar{{end}}" src="{{with .Channel.LogoURL}}{{.}}{{else}}{{asset "logo.png"}}{{end}}" alt="" width="120" height="120">
      <h1 class="login-title">{{.Channel.Title}}</h1>
      <p class="brand-sub">Zaloguj się, aby zobaczyć statystyki kanału.</p>
    </div>
    {{if .Error}}<div class="banner banner-error" role="alert">{{.Error}}</div>{{end}}
    <form method="post" action="/yt/login" class="form">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <div class="field">
        <label for="username">Nazwa użytkownika</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required autofocus>
      </div>
      <div class="field">
        <label for="password">Hasło</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      </div>
      <label class="check">
        <input type="checkbox" name="remember" value="1">
        <span>Zapamiętaj mnie na 90 dni</span>
      </label>
      <button class="btn btn-primary btn-block" type="submit">Zaloguj</button>
    </form>
  </div>
</main>
</body>
</html>
